# Builds the portable Windows version on a GitHub Windows runner.
# Run manually (Actions → Windows portable → Run workflow) or on a version tag (v*),
# in which case the .zip is attached to the release.
name: Windows portable
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
      - run: bash windows/construire_windows.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MBTiles_Fusion_Windows_portable
          path: windows/MBTiles_Fusion_Windows_portable.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/MBTiles_Fusion_Windows_portable.zip
